name: Test & Release

# Controls when the action will run. 
# - For PRs: runs tests on any PR to main, rc/**, or dev branches
# - For pushes: runs tests and (if successful) the release job, but only on main and rc/** branches
on:
  push:
    branches: [ main, rc/** ]
  pull_request:
    branches: [ main, rc/**, dev ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:    
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  release:
    # only release to main or rc branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/rc/'))
    needs: test
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Trusted Publishing (OIDC) requires Node >= 22.14
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm clean-install

      - name: Upgrade npm
        run: npm install -g npm@12 # Trusted Publishing requires npm >= 11.5.1
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Build
        run: npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
